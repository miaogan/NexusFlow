syntax = "proto3";

package vectorization.v1;

option go_package = "github.com/nexusflow/nexusflow/backend/pb/vectorization/v1;vectorizationv1";

// ========== 认证服务：注册 / 登录 / 刷新 / 登出 / 校验 ==========
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Validate(ValidateRequest) returns (ValidateResponse);
}

// ========== 用户与 RBAC 服务：用户 CRUD + 角色/权限管理 ==========
service KnowledgeBaseService {
  rpc CreateKnowledgeBase(CreateKnowledgeBaseRequest) returns (KnowledgeBaseResponse);
  rpc GetKnowledgeBase(GetKnowledgeBaseRequest) returns (KnowledgeBaseResponse);
  rpc ListKnowledgeBases(ListKnowledgeBasesRequest) returns (ListKnowledgeBasesResponse);
  rpc UpdateKnowledgeBase(UpdateKnowledgeBaseRequest) returns (KnowledgeBaseResponse);
  rpc DeleteKnowledgeBase(DeleteKnowledgeBaseRequest) returns (DeleteKnowledgeBaseResponse);

  // 知识库级 RBAC：显式绑定用户或角色到 kb:admin / kb:editor / kb:viewer。
  rpc GrantKnowledgeBasePermission(GrantKnowledgeBasePermissionRequest) returns (KnowledgeBasePermissionResponse);
  rpc RevokeKnowledgeBasePermission(RevokeKnowledgeBasePermissionRequest) returns (DeleteKnowledgeBaseResponse);
  rpc ListKnowledgeBasePermissions(ListKnowledgeBasePermissionsRequest) returns (ListKnowledgeBasePermissionsResponse);
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc UpsertRole(UpsertRoleRequest) returns (RoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
}

// ---------- 共享模型 ----------

message UserInfo {
  string id = 1;
  string tenant_id = 2;
  string username = 3;
  string email = 4;
  repeated string roles = 5;
  repeated string departments = 6;
  string status = 7;  // active | disabled
  string created_at = 8;
  string updated_at = 9;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;  // access token 有效期（秒）
}

message RoleInfo {
  string name = 1;
  repeated string permissions = 2;
  bool builtin = 3;
  string description = 4;
}

message PermissionInfo {
  string key = 1;
  string description = 2;
}

// ---------- Knowledge bases ----------

message KnowledgeBaseInfo {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  string created_at = 5;
  string updated_at = 6;
  string role = 7;             // 调用者在该库的有效角色：kb:admin / kb:editor / kb:viewer
  string status = 8;           // ACTIVE / ARCHIVED / DELETING
  string created_by = 9;
  string embedding_model = 10;
}

message KnowledgeBasePermissionInfo {
  string id = 1;
  string tenant_id = 2;
  string kb_id = 3;
  string subject_type = 4;  // user | role
  string subject_id = 5;    // user_id 或 role_name
  string permission = 6;    // kb:admin | kb:editor | kb:viewer
  string created_at = 7;
}

message GrantKnowledgeBasePermissionRequest {
  string kb_id = 1;
  string subject_type = 2;
  string subject_id = 3;
  string permission = 4;
}

message RevokeKnowledgeBasePermissionRequest {
  string kb_id = 1;
  string subject_type = 2;
  string subject_id = 3;
}

message ListKnowledgeBasePermissionsRequest {
  string kb_id = 1;
}

message KnowledgeBasePermissionResponse {
  KnowledgeBasePermissionInfo permission = 1;
}

message ListKnowledgeBasePermissionsResponse {
  repeated KnowledgeBasePermissionInfo permissions = 1;
}

message CreateKnowledgeBaseRequest {
  string name = 1;
  string description = 2;
}

message GetKnowledgeBaseRequest {
  string id = 1;
}

message ListKnowledgeBasesRequest {}

message UpdateKnowledgeBaseRequest {
  string id = 1;
  string name = 2;          // 空表示不改
  string description = 3;
}

message DeleteKnowledgeBaseRequest {
  string id = 1;
}

message KnowledgeBaseResponse {
  KnowledgeBaseInfo knowledge_base = 1;
}

message ListKnowledgeBasesResponse {
  repeated KnowledgeBaseInfo knowledge_bases = 1;
}

message DeleteKnowledgeBaseResponse {
  bool success = 1;
}

// ---------- Auth ----------

message RegisterRequest {
  string tenant_id = 1;
  string username = 2;
  string password = 3;
  string email = 4;
}

message RegisterResponse {
  UserInfo user = 1;
}

message LoginRequest {
  string tenant_id = 1;
  string username = 2;
  string password = 3;
}

message LoginResponse {
  TokenPair tokens = 1;
  UserInfo user = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message ValidateRequest {
  string access_token = 1;
}

message ValidateResponse {
  bool valid = 1;
  UserInfo user = 2;
}

// ---------- Users ----------

message CreateUserRequest {
  string tenant_id = 1;
  string username = 2;
  string password = 3;
  string email = 4;
  repeated string roles = 5;
  repeated string departments = 6;
}

message UserResponse {
  UserInfo user = 1;
}

message GetUserRequest {
  string tenant_id = 1;
  string id = 2;
}

message ListUsersRequest {
  string tenant_id = 1;
  string query = 2;  // username / email 模糊匹配
  int32 limit = 3;
  int32 offset = 4;
}

message ListUsersResponse {
  repeated UserInfo users = 1;
  int32 total = 2;
}

message UpdateUserRequest {
  string tenant_id = 1;
  string id = 2;
  string email = 3;            // 空表示不改
  repeated string roles = 4;   // 空表示不改
  repeated string departments = 5;
  string status = 6;           // 空表示不改；active | disabled
  string password = 7;         // 非空则重置密码
}

message DeleteUserRequest {
  string tenant_id = 1;
  string id = 2;
}

message DeleteUserResponse {
  bool success = 1;
}

// ---------- Roles / Permissions ----------

message ListRolesRequest {}

message ListRolesResponse {
  repeated RoleInfo roles = 1;
}

message UpsertRoleRequest {
  string name = 1;
  repeated string permissions = 2;
  string description = 3;
}

message RoleResponse {
  RoleInfo role = 1;
}

message DeleteRoleRequest {
  string name = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated PermissionInfo permissions = 1;
}
