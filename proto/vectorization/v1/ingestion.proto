syntax = "proto3";

package vectorization.v1;

option go_package = "github.com/nexusflow/nexusflow/backend/pb/vectorization/v1;vectorizationv1";

// ========== 摄入服务（Go）==========
service IngestionService {
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc RetryTask(RetryTaskRequest) returns (RetryTaskResponse);
  rpc ReindexTask(ReindexTaskRequest) returns (ReindexTaskResponse);
}

message UploadFileRequest {
  string file_name = 1;
  string file_type = 2;  // pdf / docx / txt
  int64 file_size = 3;
  string presigned_url = 4;  // 预签名直传地址
  map<string, string> metadata = 5;
  string object_key = 6;    // 已落地的对象存储 key（gateway 直传时填写）
  string content_hash = 7;  // 文件内容 sha256，作为幂等键
  string kb_id = 8;         // 知识库 ID，空值由入口规范化为 default
}

message TaskSummary {
  string task_id = 1;
  string status = 2;
  int32 progress = 3;
  string file_name = 4;
  string file_type = 5;
  int64 file_size = 6;
  string content_hash = 7;
  string error_msg = 8;
  string created_at = 9;
  string updated_at = 10;
  string kb_id = 11;
}

message ListTasksRequest {
  string status = 1;  // 空表示全部
  int32 limit = 2;
  int32 offset = 3;
  string kb_id = 4;  // 非空时仅返回该知识库任务
}

message ListTasksResponse {
  repeated TaskSummary tasks = 1;
  int32 total = 2;
}

message UploadFileResponse {
  string task_id = 1;
  string status = 2;
  string message = 3;
  // created=false means an existing task matched the content hash; the caller
  // may discard any object it just stored for this upload.
  bool created = 4;
}

message GetTaskStatusRequest {
  string task_id = 1;
  string kb_id = 2;
}

message GetTaskStatusResponse {
  string task_id = 1;
  string status = 2;
  int32 progress = 3;
  string error_msg = 4;
  string content_hash = 5;
  map<string, string> metadata = 6;
  string file_name = 7;
  string file_type = 8;
  int64 file_size = 9;
  string created_at = 10;
  string updated_at = 11;
  string kb_id = 12;
}

message DeleteTaskRequest {
  string task_id = 1;
  string kb_id = 2;
}

message DeleteTaskResponse {
  bool success = 1;
  string kb_id = 2;
  bool object_deleted = 3;  // 对象存储文件是否已清理
  int32 index_deleted = 4;  // 已清理的向量/图谱片段数（0 表示无索引或未配置索引服务）
}

message RetryTaskRequest {
  string task_id = 1;
  string kb_id = 2;
}

message RetryTaskResponse {
  string task_id = 1;
  string status = 2;
  string message = 3;
}

message ReindexTaskRequest {
  string task_id = 1;
  string kb_id = 2;
}

message ReindexTaskResponse {
  string task_id = 1;
  string status = 2;
  string message = 3;
}
