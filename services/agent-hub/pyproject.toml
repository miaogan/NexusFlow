[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusflow-agents"
version = "1.0.0"
description = "NexusFlow multi-agent hub: RAG chat, intent, summary and memory agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<0.29",
  "prometheus-client>=0.21,<0.22",
  "langgraph>=0.2.60",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "psycopg[binary]>=3.2",
  "qdrant-client>=1.12,<1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<0.26",
  "ruff>=0.9,<0.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexusflow_agents*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI's Depends/Query defaults are the established pattern in this repo.
ignore = ["B008"]
