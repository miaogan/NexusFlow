[project]
name = "nexusflow-llamaindex"
version = "4.0.0"
description = "LlamaIndex data processing and retrieval service for NexusFlow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<0.29",
  "prometheus-client>=0.21,<0.22",
  "llama-index-core>=0.12,<0.13",
  "llama-index-vector-stores-qdrant>=0.4,<0.5",
  "llama-index-embeddings-openai>=0.3,<0.4",
  "qdrant-client>=1.12,<1.14",
  "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<0.26",
  "ruff>=0.9,<0.10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
