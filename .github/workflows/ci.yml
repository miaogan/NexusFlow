name: CI

on:
  # Run on every branch push; pull_request covers fork/PR events too.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vet + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  rag-agent:
    name: RAG agent (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/rag-agent/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  llamaindex:
    name: LlamaIndex service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/llamaindex
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/llamaindex/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  eval-unit:
    name: Offline eval scripts (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: unittest
        run: python -m unittest discover -s eval -p 'test_*.py' -v

  rag-eval-gate:
    name: Offline RAG evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build dev-all
        working-directory: backend
        run: go build -trimpath -o bin/dev-all ./cmd/dev-all

      - name: Start pipeline
        run: |
          ./backend/bin/dev-all > dev-all.log 2>&1 &
          echo $! > dev-all.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "gateway is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "gateway did not become healthy in time"
          cat dev-all.log
          exit 1

      - name: Offline RAG evaluation
        run: python3 eval/rag_eval.py --base-url http://127.0.0.1:8080 --k 2

      - name: Upload pipeline log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dev-all-log
          path: dev-all.log
          retention-days: 7

      - name: Stop pipeline
        if: always()
        run: |
          if [ -f dev-all.pid ]; then kill "$(cat dev-all.pid)" || true; fi

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
