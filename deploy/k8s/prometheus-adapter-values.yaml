# prometheus-adapter values for the NexusFlow HPA custom metrics.
#
# Install/upgrade:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install prometheus-adapter prometheus-community/prometheus-adapter \
#     -n monitoring --create-namespace -f deploy/k8s/prometheus-adapter-values.yaml
#
# The adapter publishes the Pods metric `nexusflow_queue_length`, which the
# processing-worker HPA (deploy/k8s/nexusflow.yaml) targets at 50 messages/pod.
# The series is labelled by service and topic, so the rule filters to the
# worker's topic and renames nothing — HPA only needs the metric name.
rules:
  default: false
  custom:
    - seriesQuery: 'nexusflow_queue_length{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: '^nexusflow_queue_length$'
        as: 'nexusflow_queue_length'
      # Average pending messages per worker pod, keeping the HPA target stable
      # when a single replica reports several topics.
      metricsQuery: 'max(<<.Series>>{<<.LabelMatchers>>,topic="file.uploaded"}) by (pod, namespace)'
    - seriesQuery: 'nexusflow_processing_latency_seconds_count{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: '^nexusflow_processing_latency_seconds_count$'
        as: 'nexusflow_processing_rps'
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[5m])) by (pod, namespace)'

resourceRules:
  cpu:
    containerQuery: |
      sum(rate(container_cpu_usage_seconds_total{<<.LabelMatchers>>,container!="",image!=""}[5m])) by (<<.GroupBy>>)
    nodeQuery: |
      sum(rate(node_cpu_seconds_total{mode!="idle"}[5m])) by (<<.GroupBy>>)
    resources:
      overrides:
        namespace:
          resource: namespace
        pod:
          resource: pod
    containerLabel: container
  memory:
    containerQuery: |
      sum(container_memory_working_set_bytes{<<.LabelMatchers>>,container!="",image!=""}) by (<<.GroupBy>>)
    nodeQuery: |
      sum(node_memory_MemTotal_bytes{<<.LabelMatchers>>} - node_memory_MemFree_bytes{<<.LabelMatchers>>} - node_memory_Buffers_bytes{<<.LabelMatchers>>} - node_memory_Cached_bytes{<<.LabelMatchers>>}) by (<<.GroupBy>>)
    resources:
      overrides:
        namespace:
          resource: namespace
        pod:
          resource: pod
    containerLabel: container
