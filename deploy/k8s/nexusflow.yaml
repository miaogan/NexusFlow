apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: nexusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: ingestion
          image: ghcr.io/nexusflow/ingestion:4.0.0
          ports:
            - containerPort: 9095
            - containerPort: 9098
            - containerPort: 9100
          envFrom:
            - configMapRef:
