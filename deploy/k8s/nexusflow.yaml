---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: processing-worker
  namespace: nexusflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: processing-worker
  minReplicas: 2
  maxReplicas: 12
  metrics:
    # Requires prometheus-adapter to expose nexusflow_queue_length as a
    # custom Pods metric (see design doc chapter 7).
    - type: Pods
      pods:
        metric:
          name: nexusflow_queue_length
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: apps/v1
kind: Deployment
