# NexusFlow Kubernetes manifests.
#
# External dependencies are expected to be provisioned separately and reachable
# by DNS name: redis, rabbitmq, minio, qdrant and opensandbox. Replace image
# tags and the Secret values before applying.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexusflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: nexusflow
data:
  APP_ENV: "prod"
  LOG_LEVEL: "info"
  STATE_DRIVER: "redis"
  REDIS_ADDR: "redis.nexusflow.svc:6379"
  QUEUE_DRIVER: "rabbitmq"
  QUEUE_URL: "amqp://nexusflow:change-me@rabbitmq.nexusflow.svc:5672/"
  OBJECT_STORE_DIR: "/data/objects"
  OBJECT_STORE_BASE: "http://minio.nexusflow.svc:9000/nexusflow"
  SANDBOX_BACKEND: "remote"
  SANDBOX_WORK_DIR: "/data/sandboxes"
  OPENSANDBOX_URL: "http://opensandbox.nexusflow.svc:8080"
  # Runtime images used when the caller passes a bare "python"/"node".
  OPENSANDBOX_PYTHON_IMAGE: "python:3.12"
  OPENSANDBOX_NODE_IMAGE: "node:18"
  METRICS_ADDR: ":9100"
  INGESTION_TARGET: "ingestion:9095"
  # Connector management/sync API served by ingestion and proxied by gateway.
  INGESTION_HTTP_ADDR: ":9098"
  CONNECTOR_TARGET: "http://ingestion:9098"
  CONNECTOR_DRIVER: "postgres"
  CONNECTOR_DATABASE_URL: "postgresql://nexusflow:change-me@postgres.nexusflow.svc:5432/nexusflow"
  # Tenant API keys for the OpenAI-compatible endpoint.
  API_KEY_DRIVER: "postgres"
  API_KEY_DATABASE_URL: "postgresql://nexusflow:change-me@postgres.nexusflow.svc:5432/nexusflow"
  # Tenant event webhooks (subscriptions + delivery logs).
  WEBHOOK_DRIVER: "postgres"
  WEBHOOK_DATABASE_URL: "postgresql://nexusflow:change-me@postgres.nexusflow.svc:5432/nexusflow"
  WEBHOOK_MAX_ATTEMPTS: "5"
  WEBHOOK_RETRY_BASE: "1s"
  # Reject loopback/private webhook targets in production (SSRF guard).
  WEBHOOK_ALLOW_PRIVATE: "false"
  GATEWAY_URL: "http://gateway:8080"
  QUERY_TARGET: "query-service:9094"
  SANDBOX_TARGET: "sandbox-execution:9093"
  AUTH_TARGET: "auth-service:9096"
  USER_TARGET: "user-service:9097"
  # Identity and metering must be shared across replicas; both reuse Redis.
  IDENTITY_DRIVER: "redis"
  METERING_DRIVER: "redis"
  LLAMAINDEX_URL: "http://llamaindex:8000"
  RAG_AGENT_URL: "http://rag-agent:8001"
  RAG_GATEWAY_URL: "http://gateway:8080"
  RAG_DATABASE_URL: "postgresql://nexusflow:change-me@postgres.nexusflow.svc:5432/nexusflow"
  # PII shielding at the LLM boundary (replies stay masked unless restored).
  RAG_PII_ENABLED: "false"
  RAG_PII_RESTORE_OUTPUT: "false"
  # LLM router: OpenAI-compatible primary/backup with breaker + token quota.
  LLM_GATEWAY_ADDR: ":8082"
  LLM_PRIMARY_BASE_URL: ""
  LLM_PRIMARY_MODEL: ""
  LLM_BACKUP_BASE_URL: ""
  LLM_BACKUP_MODEL: ""
  LLM_DAILY_TOKEN_LIMIT: "0"
  LLM_QUOTA_DRIVER: "redis"
  LLM_BREAKER_THRESHOLD: "3"
  LLM_BREAKER_COOLDOWN: "30s"
  LLM_UPSTREAM_TIMEOUT: "120s"
  # Single-container star hub: RAG chat plus in-process intent/summary/memory.
  AGENT_HUB_ROLE: "all"
  AGENT_HUB_MODE: "local"
  AGENT_HUB_PORT: "8001"
  AGENT_HUB_PREFER: "local"
  AGENT_HUB_DYNAMIC_REGISTRATION: "false"
  # Tenant-scoped custom SubAgents persist in Postgres.
  AGENT_HUB_REGISTRY_DRIVER: "postgres"
  AGENT_HUB_REGISTRY_DATABASE_URL: "postgresql://nexusflow:change-me@postgres.nexusflow.svc:5432/nexusflow"
  # HITL approval tickets and the audit trail are shared across replicas.
  AGENT_HUB_APPROVAL_DRIVER: "postgres"
  AGENT_HUB_AUDIT_DRIVER: "postgres"
  AGENT_HUB_STATE_DATABASE_URL: "postgresql://nexusflow:change-me@postgres.nexusflow.svc:5432/nexusflow"
  # Tools / reasoning / MCP / HITL switches (roll out in order).
  AGENT_HUB_TOOLS_ENABLED: "false"
  AGENT_HUB_REASONING_ENABLED: "false"
  AGENT_HUB_MCP_ENABLED: "false"
  AGENT_HUB_HITL_ENABLED: "false"
  AGENT_HUB_WORKFLOW_ENABLED: "false"
  AGENT_HUB_WORKFLOW_URL: "http://workflow-engine:8081"
  AGENT_HUB_REASONING_MAX_TURNS: "6"
  AGENT_HUB_REASONING_TIMEOUT_SECONDS: "60"
  AGENT_HUB_REASONING_TOOL_BUDGET: "12"
  AGENT_HUB_REASONING_TOKEN_BUDGET: "20000"
  AGENT_HUB_MCP_SERVERS: ""
  # Workflow engine proxy + DAG -> Agent Hub node.
  WORKFLOW_TARGET: "http://workflow-engine:8081"
  WORKFLOW_AGENT_NODE: "false"
  AGENT_HUB_URL: "http://rag-agent:8001"
  AGENT_HUB_TIMEOUT: "30s"
  HITL_ENABLED: "false"
  # Suspended workflow runs and approval tickets survive restarts and are
  # visible to every workflow-engine replica.
  WORKFLOW_RUN_STORE_DRIVER: "postgres"
  WORKFLOW_RUN_DATABASE_URL: "postgresql://nexusflow:change-me@postgres.nexusflow.svc:5432/nexusflow"
  # Memory content lives in Postgres; vectors live in Qdrant.
  MEMORY_DRIVER: "qdrant"
  MEMORY_DATABASE_URL: "postgresql://nexusflow:change-me@postgres.nexusflow.svc:5432/nexusflow"
  MEMORY_QDRANT_URL: "http://qdrant.nexusflow.svc:6333"
  MEMORY_QDRANT_COLLECTION: "nexusflow_memories"
  # Tenant quotas. 0 means unlimited; sizes are in bytes.
  QUOTA_MAX_STORAGE_BYTES: "10737418240"
  QUOTA_MAX_FILES: "5000"
  QUOTA_MAX_QUERIES: "100000"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: nexusflow
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  OPENSANDBOX_TOKEN: ""
  # Shared by gateway -> workflow and agent-hub -> workflow; empty disables
  # the direct-access check (dev only).
  WORKFLOW_SERVICE_TOKEN: ""
  AGENT_HUB_WORKFLOW_SERVICE_TOKEN: ""
  # Gateway -> hub service token; keep equal to AGENT_HUB_ADMIN_TOKEN.
  AGENT_HUB_TOKEN: ""
  AGENT_HUB_ADMIN_TOKEN: ""
  # AES-GCM key for connector configs at rest; empty stores plaintext (dev only).
  CONNECTOR_ENCRYPTION_KEY: ""
  # Shared token for POST /v1/internal/events; empty disables webhook ingest.
  WEBHOOK_EVENTS_TOKEN: ""
  # Optional dedicated encryption key for webhook signing secrets.
  WEBHOOK_ENCRYPTION_KEY: ""
  # LLM router upstream credentials (empty disables the corresponding route).
  LLM_PRIMARY_API_KEY: ""
  LLM_BACKUP_API_KEY: ""
  LLAMAINDEX_EMBEDDING_API_KEY: ""
  RAG_LLM_BASE_URL: ""
  RAG_LLM_API_KEY: ""
---
# Shared object storage. Gateway writes uploads, ingestion deletes them and the
# processing worker streams them back for parsing, so all three pods need the
# same ReadWriteMany volume. Replace storageClassName with the RWX class that
# your cluster provides (nfs-client, cephfs, efs-sc, ...).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: object-store
  namespace: nexusflow
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 100Gi
---
# Sandbox scratch space shared by every sandbox-execution replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-work
  namespace: nexusflow
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: nexusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/nexusflow/gateway:4.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: object-store
              mountPath: /data/objects
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: object-store
          persistentVolumeClaim:
            claimName: object-store
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: nexusflow
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nexusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/nexusflow/auth-service:4.0.0
          ports:
            - containerPort: 9096
            - containerPort: 9100
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            - name: AUTH_GRPC_ADDR
              value: ":9096"
          readinessProbe:
            tcpSocket:
              port: 9096
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nexusflow
spec:
  selector:
    app: auth-service
  ports:
    - port: 9096
      targetPort: 9096
