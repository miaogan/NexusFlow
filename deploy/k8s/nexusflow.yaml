apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamaindex
  namespace: nexusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llamaindex
  template:
    metadata:
      labels:
        app: llamaindex
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: llamaindex
          image: ghcr.io/nexusflow/llamaindex:4.0.0
          ports:
            - containerPort: 8000
          env:
            - name: LLAMAINDEX_QDRANT_URL
              value: "http://qdrant.nexusflow.svc:6333"
            - name: LLAMAINDEX_SPARSE_ENABLED
              value: "true"
            - name: LLAMAINDEX_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: LLAMAINDEX_EMBEDDING_API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llamaindex
  namespace: nexusflow
spec:
  selector:
