  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-hub
  namespace: nexusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-hub
  template:
    metadata:
      labels:
        app: agent-hub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: agent-hub
          image: ghcr.io/nexusflow/agent-hub:1.0.0
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            # Reuse the RAG model credentials for the in-process agents.
            - name: INTENT_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: RAG_LLM_BASE_URL
            - name: INTENT_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: RAG_LLM_API_KEY
            - name: SUMMARY_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: RAG_LLM_BASE_URL
            - name: SUMMARY_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: RAG_LLM_API_KEY
            - name: MEMORY_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: RAG_LLM_BASE_URL
            - name: MEMORY_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: RAG_LLM_API_KEY
            - name: MEMORY_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: LLAMAINDEX_EMBEDDING_API_KEY
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
# Keep the old service name so gateway RAG_AGENT_URL keeps working.
apiVersion: v1
kind: Service
metadata:
  name: rag-agent
  namespace: nexusflow
spec:
  selector:
    app: agent-hub
  ports:
