---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: nexusflow
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: nexusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: llm-gateway
          image: ghcr.io/nexusflow/llm-gateway:4.0.0
          ports:
            - containerPort: 8082
            - containerPort: 9100
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: nexusflow
spec:
  selector:
    app: llm-gateway
  ports:
    - port: 8082
      targetPort: 8082
