  namespace: nexusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processing-worker
  template:
    metadata:
      labels:
        app: processing-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: processing-worker
          image: ghcr.io/nexusflow/processing-worker:4.0.0
          ports:
            - containerPort: 9092
            - containerPort: 9100
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            - name: PROCESSING_GRPC_ADDR
              value: ":9092"
            - name: MINERU_TARGET
              value: "http://mineru.nexusflow.svc:8080"
          volumeMounts:
            - name: object-store
              mountPath: /data/objects
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: object-store
          persistentVolumeClaim:
