global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nexusflow-gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: nexusflow-ingestion
    static_configs:
      - targets: ["ingestion:9100"]

  - job_name: nexusflow-processing-worker
    static_configs:
      - targets: ["processing-worker:9100"]

  - job_name: nexusflow-query-service
    static_configs:
      - targets: ["query-service:9100"]

  - job_name: nexusflow-sandbox
    static_configs:
      - targets: ["sandbox-execution:9100"]

  - job_name: nexusflow-llamaindex
    static_configs:
      - targets: ["llamaindex:8000"]
