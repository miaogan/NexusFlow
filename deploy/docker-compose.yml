name: nexusflow

x-app-env: &app-env
  APP_ENV: prod
  LOG_LEVEL: info
  STATE_DRIVER: redis
  REDIS_ADDR: redis:6379
  QUEUE_DRIVER: rabbitmq
  QUEUE_URL: amqp://guest:guest@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET:-nexusflow-dev-secret}
  ALLOW_ANONYMOUS: "true"
  # Share the JWT revocation list between gateway and auth-service.
  TOKEN_BLACKLIST_DRIVER: redis
  OBJECT_STORE_DIR: /data/objects
  OBJECT_STORE_BASE: http://minio:9000/nexusflow
  SANDBOX_BACKEND: local
  # Compose is a local/demo topology; the local backend is explicitly allowed.
  # Production clusters must use SANDBOX_BACKEND=remote (see deploy/k8s).
  SANDBOX_ALLOW_LOCAL: "true"
  SANDBOX_WORK_DIR: /tmp/nexusflow-sandboxes
  METRICS_ADDR: ":9100"

# Shared probe tuning; every business container adds its own /healthz test.
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 20s

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  postgres:
    # pgvector image is kept for the legacy MEMORY_DRIVER=postgres rollback path;
    # the default qdrant driver stores memory vectors in Qdrant.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nexusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusflow}
      POSTGRES_DB: nexusflow
    ports: ["${POSTGRES_PUBLISH_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusflow -d nexusflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  minio:
    # Optional: the Go services persist objects on the local volume today.
    profiles: ["extras"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  gateway:
    build:
      context: ../backend
      args:
        SERVICE: gateway
    environment:
      <<: *app-env
      GATEWAY_HTTP_ADDR: ":8080"
      INGESTION_TARGET: "ingestion:9095"
      QUERY_TARGET: "query-service:9094"
      SANDBOX_TARGET: "sandbox-execution:9093"
      AUTH_TARGET: "auth-service:9096"
      USER_TARGET: "user-service:9097"
      RAG_AGENT_URL: "http://agent-hub:8001"
      # Forwarded to the hub when AGENT_HUB_ADMIN_TOKEN is configured.
      AGENT_HUB_TOKEN: ${AGENT_HUB_ADMIN_TOKEN:-nexusflow-agent-admin}
      # DAG validate/run proxy (RBAC: workflow:run).
      WORKFLOW_TARGET: "http://workflow-engine:8081"
      WORKFLOW_SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN:-}
      # External data connectors (proxied to the ingestion HTTP listener).
      CONNECTOR_TARGET: "http://ingestion:9098"
      # Persist ratings/implicit feedback even when tracing is a no-op.
      FEEDBACK_DRIVER: postgres
      FEEDBACK_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      # Tenant API keys for the OpenAI-compatible endpoint.
      API_KEY_DRIVER: postgres
      API_KEY_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      # Tenant event webhooks (subscriptions + delivery logs).
      WEBHOOK_DRIVER: postgres
      WEBHOOK_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      WEBHOOK_EVENTS_TOKEN: ${WEBHOOK_EVENTS_TOKEN:-}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      # Compose is a demo topology; allow local receivers unless overridden.
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-true}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      METRICS_ADDR: ""
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    depends_on:
      ingestion:
        condition: service_healthy
      query-service:
        condition: service_healthy
      sandbox-execution:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      agent-hub:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: ["objects:/data/objects"]
    ports: ["${GATEWAY_PUBLISH_PORT:-8080}:8080"]

  llm-gateway:
    build:
      context: ../backend
      args:
        SERVICE: llm-gateway
    environment:
      <<: *app-env
      LLM_GATEWAY_ADDR: ":8082"
      # Primary/backup OpenAI-compatible upstreams. Empty routes keep the
      # service healthy but return 502 until configured.
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL:-}
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-}
      LLM_BACKUP_BASE_URL: ${LLM_BACKUP_BASE_URL:-}
      LLM_BACKUP_API_KEY: ${LLM_BACKUP_API_KEY:-}
      LLM_BACKUP_MODEL: ${LLM_BACKUP_MODEL:-}
      # Per-tenant daily token budget (0 = unlimited) and breaker tuning.
      LLM_DAILY_TOKEN_LIMIT: ${LLM_DAILY_TOKEN_LIMIT:-0}
      LLM_QUOTA_DRIVER: ${LLM_QUOTA_DRIVER:-redis}
      LLM_BREAKER_THRESHOLD: ${LLM_BREAKER_THRESHOLD:-3}
      LLM_BREAKER_COOLDOWN: ${LLM_BREAKER_COOLDOWN:-30s}
      LLM_UPSTREAM_TIMEOUT: ${LLM_UPSTREAM_TIMEOUT:-120s}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
    depends_on:
      redis:
        condition: service_healthy
    ports: ["${LLM_GATEWAY_PUBLISH_PORT:-8082}:8082"]

  auth-service:
    build:
      context: ../backend
      args:
        SERVICE: auth-service
    environment:
      <<: *app-env
      AUTH_GRPC_ADDR: ":9096"
      # Users/roles are shared with user-service through PostgreSQL; the
      # identity schema and seed admin are created idempotently on start.
      IDENTITY_DRIVER: postgres
      IDENTITY_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/healthz"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["9096:9096"]

  user-service:
    build:
      context: ../backend
      args:
        SERVICE: user-service
    environment:
      <<: *app-env
      USER_GRPC_ADDR: ":9097"
      IDENTITY_DRIVER: postgres
      IDENTITY_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/healthz"]
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["9097:9097"]

  ingestion:
    build:
      context: ../backend
      args:
        SERVICE: ingestion
    environment:
      <<: *app-env
      INGESTION_GRPC_ADDR: ":9095"
      # Connector management/sync API (gateway proxies /v1/connectors here).
      INGESTION_HTTP_ADDR: ":9098"
      CONNECTOR_DRIVER: ${CONNECTOR_DRIVER:-postgres}
      CONNECTOR_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      # Configs hold S3/DB credentials; empty keeps plaintext for local demos.
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:-}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/healthz"]
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes: ["objects:/data/objects"]

  processing-worker:
    build:
      context: ../backend
      args:
        SERVICE: processing-worker
    environment:
      <<: *app-env
      PROCESSING_GRPC_ADDR: ":9092"
      MINERU_TARGET: ${MINERU_TARGET:-}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
      MINERU_TIER: ${MINERU_TIER:-standard}
      PARSE_MAX_ATTEMPTS: "3"
      # Parsed Markdown is indexed into Qdrant through the LlamaIndex service.
      LLAMAINDEX_URL: "http://llamaindex:8000"
      # Publish task/index events to the gateway webhook ingest endpoint.
      GATEWAY_URL: "http://gateway:8080"
      WEBHOOK_EVENTS_TOKEN: ${WEBHOOK_EVENTS_TOKEN:-}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/healthz"]
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      llamaindex:
        condition: service_healthy
    volumes: ["objects:/data/objects"]

  sandbox-execution:
    build:
      context: ../backend
      args:
        SERVICE: sandbox-execution
        # Local sandbox needs interpreter runtimes; production uses OpenSandbox.
        INSTALL_RUNTIMES: "true"
    environment:
      <<: *app-env
      SANDBOX_GRPC_ADDR: ":9093"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/healthz"]
    ports: ["9093:9093"]

  query-service:
    build:
      context: ../backend
      args:
        SERVICE: query-service
    environment:
      <<: *app-env
      QUERY_GRPC_ADDR: ":9094"
      RERANK_URL: ${RERANK_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-bge-reranker-v2-m3}
      RERANK_PROTOCOL: ${RERANK_PROTOCOL:-generic}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_POOL: ${RERANK_POOL:-0}
      RERANK_TIMEOUT: ${RERANK_TIMEOUT:-8s}
      # Graph recall (LightRAG-style entity graph) runs in the LlamaIndex service.
      LLAMAINDEX_URL: "http://llamaindex:8000"
      # Read the same feedback table as the gateway so online down-ranking sees
      # ratings submitted against cited chunks.
      FEEDBACK_DRIVER: postgres
      FEEDBACK_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/healthz"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      llamaindex:
        condition: service_healthy

  workflow-engine:
    build:
      context: ../backend
      args:
        SERVICE: workflow-engine
    environment:
      <<: *app-env
      WORKFLOW_HTTP_ADDR: ":8081"
      # Gateway/agent calls carry this token; direct access is rejected.
      WORKFLOW_SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN:-}
      # DAG -> Agent Hub node and human approval runs.
      WORKFLOW_AGENT_NODE: ${WORKFLOW_AGENT_NODE:-false}
      AGENT_HUB_URL: "http://agent-hub:8001"
      AGENT_HUB_TOKEN: ${AGENT_HUB_ADMIN_TOKEN:-nexusflow-agent-admin}
      AGENT_HUB_TIMEOUT: 30s
      HITL_ENABLED: ${HITL_ENABLED:-false}
      # Suspended runs and approval tickets persist across restarts and are
      # shared by every replica.
      WORKFLOW_RUN_STORE_DRIVER: ${WORKFLOW_RUN_STORE_DRIVER:-postgres}
      WORKFLOW_RUN_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      # nl2sql node: read-only structured queries over the shared Postgres.
      # Production must point this at a SELECT-only role.
      NL2SQL_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      NL2SQL_SCHEMA: "rag_feedback(tenant_id, user_id, subject_id, name, rating, query_text, answer_text, created_at)"
      # Question -> SQL generation; empty -> only config.sql / sql_from works.
      NL2SQL_LLM_BASE_URL: ${NL2SQL_LLM_BASE_URL:-}
      NL2SQL_LLM_API_KEY: ${NL2SQL_LLM_API_KEY:-}
      NL2SQL_LLM_MODEL: ${NL2SQL_LLM_MODEL:-gpt-4o-mini}
      # Publish workflow lifecycle events to the gateway webhook endpoint.
      GATEWAY_URL: "http://gateway:8080"
      WEBHOOK_EVENTS_TOKEN: ${WEBHOOK_EVENTS_TOKEN:-}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8081:8081"]

  llamaindex:
    build:
      context: ../services/llamaindex
    environment:
      LLAMAINDEX_APP_ENV: prod
      LLAMAINDEX_QDRANT_URL: http://qdrant:6333
      LLAMAINDEX_SPARSE_ENABLED: ${LLAMAINDEX_SPARSE_ENABLED:-true}
      LLAMAINDEX_EMBEDDING_API_KEY: ${LLAMAINDEX_EMBEDDING_API_KEY:-}
      LLAMAINDEX_EMBEDDING_API_BASE: ${LLAMAINDEX_EMBEDDING_API_BASE:-https://api.openai.com/v1}
      LLAMAINDEX_EMBEDDING_MODEL: ${LLAMAINDEX_EMBEDDING_MODEL:-text-embedding-3-large}
      LLAMAINDEX_EMBEDDING_BATCH_SIZE: ${LLAMAINDEX_EMBEDDING_BATCH_SIZE:-16}
      LLAMAINDEX_RERANK_URL: ${LLAMAINDEX_RERANK_URL:-${RERANK_URL:-}}
      LLAMAINDEX_RERANK_MODEL: ${LLAMAINDEX_RERANK_MODEL:-bge-reranker-v2-m3}
      LLAMAINDEX_RERANK_PROTOCOL: ${LLAMAINDEX_RERANK_PROTOCOL:-generic}
      LLAMAINDEX_RERANK_API_KEY: ${LLAMAINDEX_RERANK_API_KEY:-}
      LLAMAINDEX_RERANK_POOL: ${LLAMAINDEX_RERANK_POOL:-0}
      LLAMAINDEX_RERANK_TIMEOUT_SECONDS: ${LLAMAINDEX_RERANK_TIMEOUT_SECONDS:-2}
      # Graph extraction LLM (empty -> co-occurrence word graph).
      LLAMAINDEX_LLM_BASE_URL: ${LLAMAINDEX_LLM_BASE_URL:-}
      LLAMAINDEX_LLM_API_KEY: ${LLAMAINDEX_LLM_API_KEY:-}
      LLAMAINDEX_LLM_MODEL: ${LLAMAINDEX_LLM_MODEL:-gpt-4o-mini}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
    depends_on: [qdrant]
    ports: ["8000:8000"]

  agent-hub:
    image: nexusflow/agent-hub:local
    build:
      context: ../services/agent-hub
    environment:
      AGENT_HUB_ROLE: all
      AGENT_HUB_MODE: ${AGENT_HUB_MODE:-local}
      AGENT_HUB_PORT: "8001"
      AGENT_HUB_PREFER: ${AGENT_HUB_PREFER:-local}
      # Local demo enables console-driven SubAgent management. Set an admin
      # token outside local; the gateway/workflow forward it as AGENT_HUB_TOKEN.
      AGENT_HUB_DYNAMIC_REGISTRATION: ${AGENT_HUB_DYNAMIC_REGISTRATION:-true}
      AGENT_HUB_ADMIN_TOKEN: ${AGENT_HUB_ADMIN_TOKEN:-nexusflow-agent-admin}
      # Tenant-scoped custom SubAgents persist in Postgres.
      AGENT_HUB_REGISTRY_DRIVER: ${AGENT_HUB_REGISTRY_DRIVER:-postgres}
      AGENT_HUB_REGISTRY_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      # HITL approval tickets and the audit trail persist in Postgres so every
      # replica sees the same pending/decided state.
      AGENT_HUB_APPROVAL_DRIVER: ${AGENT_HUB_APPROVAL_DRIVER:-postgres}
      AGENT_HUB_AUDIT_DRIVER: ${AGENT_HUB_AUDIT_DRIVER:-postgres}
      AGENT_HUB_AUDIT_RETENTION_DAYS: ${AGENT_HUB_AUDIT_RETENTION_DAYS:-180}
      AGENT_HUB_STATE_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      # Tool calling, reasoning, MCP and human approval (all default off).
      AGENT_HUB_TOOLS_ENABLED: ${AGENT_HUB_TOOLS_ENABLED:-false}
      AGENT_HUB_REASONING_ENABLED: ${AGENT_HUB_REASONING_ENABLED:-false}
      AGENT_HUB_MCP_ENABLED: ${AGENT_HUB_MCP_ENABLED:-false}
      AGENT_HUB_HITL_ENABLED: ${AGENT_HUB_HITL_ENABLED:-false}
      AGENT_HUB_WORKFLOW_ENABLED: ${AGENT_HUB_WORKFLOW_ENABLED:-false}
      AGENT_HUB_WORKFLOW_URL: "http://workflow-engine:8081"
      AGENT_HUB_WORKFLOW_SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN:-}
      AGENT_HUB_REASONING_MAX_TURNS: ${AGENT_HUB_REASONING_MAX_TURNS:-6}
      AGENT_HUB_REASONING_TIMEOUT_SECONDS: ${AGENT_HUB_REASONING_TIMEOUT_SECONDS:-60}
      AGENT_HUB_REASONING_TOOL_BUDGET: ${AGENT_HUB_REASONING_TOOL_BUDGET:-12}
      AGENT_HUB_REASONING_TOKEN_BUDGET: ${AGENT_HUB_REASONING_TOKEN_BUDGET:-20000}
      AGENT_HUB_REASONING_TOOL_TIMEOUT_SECONDS: ${AGENT_HUB_REASONING_TOOL_TIMEOUT_SECONDS:-30}
      AGENT_HUB_REASONING_TOOL_PROGRESS_SECONDS: ${AGENT_HUB_REASONING_TOOL_PROGRESS_SECONDS:-2}
      AGENT_HUB_MCP_SERVERS: ${AGENT_HUB_MCP_SERVERS:-}
      AGENT_HUB_MCP_SESSION_DRIVER: ${AGENT_HUB_MCP_SESSION_DRIVER:-postgres}
      AGENT_HUB_MCP_SESSION_TTL_SECONDS: ${AGENT_HUB_MCP_SESSION_TTL_SECONDS:-86400}
      # Retrieval goes through the gateway so chat reuses the unified
      # multi-route recall + rerank pipeline.
      RAG_APP_ENV: prod
      RAG_GATEWAY_URL: http://gateway:8080
      RAG_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      # Only used in AGENT_HUB_MODE=remote|hybrid; local mode calls in-process.
      RAG_INTENT_URL: ${RAG_INTENT_URL:-http://agent-hub-intent:8002}
      RAG_SUMMARY_URL: ${RAG_SUMMARY_URL:-http://agent-hub-summary:8003}
      RAG_MEMORY_URL: ${RAG_MEMORY_URL:-http://agent-hub-memory:8004}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-4o-mini}
      # PII shielding: prompts/context are masked; replies stay masked unless
      # restore is explicitly enabled.
      RAG_PII_ENABLED: ${RAG_PII_ENABLED:-false}
      RAG_PII_RESTORE_OUTPUT: ${RAG_PII_RESTORE_OUTPUT:-false}
      RAG_DEFAULT_TOP_K: "5"
      INTENT_LLM_BASE_URL: ${INTENT_LLM_BASE_URL:-}
      INTENT_LLM_API_KEY: ${INTENT_LLM_API_KEY:-}
      INTENT_LLM_MODEL: ${INTENT_LLM_MODEL:-deepseek-chat}
      SUMMARY_LLM_BASE_URL: ${SUMMARY_LLM_BASE_URL:-}
      SUMMARY_LLM_API_KEY: ${SUMMARY_LLM_API_KEY:-}
      SUMMARY_LLM_MODEL: ${SUMMARY_LLM_MODEL:-deepseek-chat}
      SUMMARY_BUDGET_CHARS: ${SUMMARY_BUDGET_CHARS:-1200}
      MEMORY_DRIVER: ${MEMORY_DRIVER:-qdrant}
      MEMORY_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      MEMORY_QDRANT_URL: ${MEMORY_QDRANT_URL:-http://qdrant:6333}
      MEMORY_QDRANT_COLLECTION: ${MEMORY_QDRANT_COLLECTION:-nexusflow_memories}
      MEMORY_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-deepseek-chat}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-text-embedding-3-small}
      MEMORY_EMBEDDING_DIM: ${MEMORY_EMBEDDING_DIM:-1536}
      MEMORY_VECTOR_INDEX: ${MEMORY_VECTOR_INDEX:-hnsw}
      MEMORY_VECTOR_INDEX_RECREATE: ${MEMORY_VECTOR_INDEX_RECREATE:-false}
      MEMORY_HNSW_M: ${MEMORY_HNSW_M:-16}
      MEMORY_HNSW_EF_CONSTRUCTION: ${MEMORY_HNSW_EF_CONSTRUCTION:-64}
      MEMORY_HNSW_EF_SEARCH: ${MEMORY_HNSW_EF_SEARCH:-40}
      MEMORY_IVFFLAT_LISTS: ${MEMORY_IVFFLAT_LISTS:-100}
      MEMORY_IVFFLAT_PROBES: ${MEMORY_IVFFLAT_PROBES:-10}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=2)"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports: ["8001:8001"]

  agent-hub-intent:
    profiles: ["split"]
    image: nexusflow/agent-hub:local
    build:
      context: ../services/agent-hub
    environment:
      AGENT_HUB_ROLE: intent
      AGENT_HUB_MODE: local
      AGENT_HUB_PORT: "8002"
      INTENT_APP_ENV: prod
      INTENT_LLM_BASE_URL: ${INTENT_LLM_BASE_URL:-}
      INTENT_LLM_API_KEY: ${INTENT_LLM_API_KEY:-}
      INTENT_LLM_MODEL: ${INTENT_LLM_MODEL:-deepseek-chat}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2)"]
    ports: ["8002:8002"]

  agent-hub-summary:
    profiles: ["split"]
    image: nexusflow/agent-hub:local
    build:
      context: ../services/agent-hub
    environment:
      AGENT_HUB_ROLE: summary
      AGENT_HUB_MODE: local
      AGENT_HUB_PORT: "8003"
      SUMMARY_APP_ENV: prod
      SUMMARY_LLM_BASE_URL: ${SUMMARY_LLM_BASE_URL:-}
      SUMMARY_LLM_API_KEY: ${SUMMARY_LLM_API_KEY:-}
      SUMMARY_LLM_MODEL: ${SUMMARY_LLM_MODEL:-deepseek-chat}
      SUMMARY_BUDGET_CHARS: ${SUMMARY_BUDGET_CHARS:-1200}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/healthz', timeout=2)"]
    ports: ["8003:8003"]

  agent-hub-memory:
    profiles: ["split"]
    image: nexusflow/agent-hub:local
    build:
      context: ../services/agent-hub
    environment:
      AGENT_HUB_ROLE: memory
      AGENT_HUB_MODE: local
      AGENT_HUB_PORT: "8004"
      MEMORY_APP_ENV: prod
      MEMORY_DRIVER: ${MEMORY_DRIVER:-qdrant}
      MEMORY_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      MEMORY_QDRANT_URL: ${MEMORY_QDRANT_URL:-http://qdrant:6333}
      MEMORY_QDRANT_COLLECTION: ${MEMORY_QDRANT_COLLECTION:-nexusflow_memories}
      MEMORY_LLM_BASE_URL: ${MEMORY_LLM_BASE_URL:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      MEMORY_LLM_MODEL: ${MEMORY_LLM_MODEL:-deepseek-chat}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-text-embedding-3-small}
      MEMORY_EMBEDDING_DIM: ${MEMORY_EMBEDDING_DIM:-1536}
      MEMORY_VECTOR_INDEX: ${MEMORY_VECTOR_INDEX:-hnsw}
      MEMORY_VECTOR_INDEX_RECREATE: ${MEMORY_VECTOR_INDEX_RECREATE:-false}
      MEMORY_HNSW_M: ${MEMORY_HNSW_M:-16}
      MEMORY_HNSW_EF_CONSTRUCTION: ${MEMORY_HNSW_EF_CONSTRUCTION:-64}
      MEMORY_HNSW_EF_SEARCH: ${MEMORY_HNSW_EF_SEARCH:-40}
      MEMORY_IVFFLAT_LISTS: ${MEMORY_IVFFLAT_LISTS:-100}
      MEMORY_IVFFLAT_PROBES: ${MEMORY_IVFFLAT_PROBES:-10}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/healthz', timeout=2)"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports: ["8004:8004"]

  web:
    build:
      context: ../web
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
    depends_on:
      gateway:
        condition: service_healthy
      workflow-engine:
        condition: service_healthy
    ports: ["8088:80"]

  prometheus:
    profiles: ["extras"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    profiles: ["extras"]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  redis-data:
  qdrant-data:
  minio-data:
  postgres-data:
  objects:
