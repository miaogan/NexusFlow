name: nexusflow

x-app-env: &app-env
  APP_ENV: prod
  LOG_LEVEL: info
  STATE_DRIVER: redis
  REDIS_ADDR: redis:6379
  QUEUE_DRIVER: rabbitmq
  QUEUE_URL: amqp://guest:guest@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET:-nexusflow-dev-secret}
  ALLOW_ANONYMOUS: "true"
  OBJECT_STORE_DIR: /data/objects
  OBJECT_STORE_BASE: http://minio:9000/nexusflow
  SANDBOX_BACKEND: local
  SANDBOX_WORK_DIR: /tmp/nexusflow-sandboxes
  METRICS_ADDR: ":9100"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexusflow}
      POSTGRES_DB: nexusflow
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusflow -d nexusflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  gateway:
    build:
      context: ../backend
      args:
        SERVICE: gateway
    environment:
      <<: *app-env
      GATEWAY_HTTP_ADDR: ":8080"
      INGESTION_TARGET: "ingestion:9095"
      QUERY_TARGET: "query-service:9094"
      SANDBOX_TARGET: "sandbox-execution:9093"
      AUTH_TARGET: "auth-service:9096"
      USER_TARGET: "user-service:9097"
      RAG_AGENT_URL: "http://rag-agent:8001"
      # Persist ratings/implicit feedback even when tracing is a no-op.
      FEEDBACK_DRIVER: postgres
      FEEDBACK_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      METRICS_ADDR: ""
    depends_on:
      ingestion:
        condition: service_started
      query-service:
        condition: service_started
      sandbox-execution:
        condition: service_started
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      rag-agent:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes: ["objects:/data/objects"]
    ports: ["8080:8080"]

  auth-service:
    build:
      context: ../backend
      args:
        SERVICE: auth-service
    environment:
      <<: *app-env
      AUTH_GRPC_ADDR: ":9096"
      # Users/roles are shared with user-service through Redis.
      IDENTITY_DRIVER: redis
    depends_on: [redis]
    ports: ["9096:9096"]

  user-service:
    build:
      context: ../backend
      args:
        SERVICE: user-service
    environment:
      <<: *app-env
      USER_GRPC_ADDR: ":9097"
      IDENTITY_DRIVER: redis
    depends_on: [redis]
    ports: ["9097:9097"]

  ingestion:
    build:
      context: ../backend
      args:
        SERVICE: ingestion
    environment:
      <<: *app-env
      INGESTION_GRPC_ADDR: ":9095"
    depends_on: [redis, rabbitmq]
    volumes: ["objects:/data/objects"]

  processing-worker:
    build:
      context: ../backend
      args:
        SERVICE: processing-worker
    environment:
      <<: *app-env
      PROCESSING_GRPC_ADDR: ":9092"
      MINERU_TARGET: ${MINERU_TARGET:-}
      PARSE_MAX_ATTEMPTS: "3"
    depends_on: [redis, rabbitmq]
    volumes: ["objects:/data/objects"]

  sandbox-execution:
    build:
      context: ../backend
      args:
        SERVICE: sandbox-execution
        # Local sandbox needs interpreter runtimes; production uses OpenSandbox.
        INSTALL_RUNTIMES: "true"
    environment:
      <<: *app-env
      SANDBOX_GRPC_ADDR: ":9093"
    ports: ["9093:9093"]

  query-service:
    build:
      context: ../backend
      args:
        SERVICE: query-service
    environment:
      <<: *app-env
      QUERY_GRPC_ADDR: ":9094"
      RERANK_URL: ${RERANK_URL:-}
    depends_on: [redis]

  workflow-engine:
    build:
      context: ../backend
      args:
        SERVICE: workflow-engine
    environment:
      <<: *app-env
      WORKFLOW_HTTP_ADDR: ":8081"
    ports: ["8081:8081"]

  llamaindex:
    build:
      context: ../services/llamaindex
    environment:
      LLAMAINDEX_APP_ENV: prod
      LLAMAINDEX_QDRANT_URL: http://qdrant:6333
      LLAMAINDEX_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      LLAMAINDEX_EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://api.openai.com/v1}
      LLAMAINDEX_RERANK_URL: ${RERANK_URL:-}
    depends_on: [qdrant]
    ports: ["8000:8000"]

  intent-agent:
    build:
      context: ../services/intent-agent
    environment:
      INTENT_APP_ENV: prod
      # OpenAI-compatible endpoint; DeepSeek works with https://api.deepseek.com/v1.
      INTENT_LLM_BASE_URL: ${INTENT_LLM_BASE_URL:-}
      INTENT_LLM_API_KEY: ${INTENT_LLM_API_KEY:-}
      INTENT_LLM_MODEL: ${INTENT_LLM_MODEL:-deepseek-chat}
    ports: ["8002:8002"]

  summary-agent:
    build:
      context: ../services/summary-agent
    environment:
      SUMMARY_APP_ENV: prod
      # Empty key -> deterministic extractive summaries (offline safe).
      SUMMARY_LLM_BASE_URL: ${SUMMARY_LLM_BASE_URL:-}
      SUMMARY_LLM_API_KEY: ${SUMMARY_LLM_API_KEY:-}
      SUMMARY_LLM_MODEL: ${SUMMARY_LLM_MODEL:-deepseek-chat}
      SUMMARY_BUDGET_CHARS: ${SUMMARY_BUDGET_CHARS:-1200}
    ports: ["8003:8003"]

  rag-agent:
    build:
      context: ../services/rag-agent
    environment:
      RAG_APP_ENV: prod
      # Retrieval goes through the gateway so chat reuses the unified
      # multi-route recall + rerank pipeline.
      RAG_GATEWAY_URL: http://gateway:8080
      # Empty RAG_DATABASE_URL -> in-memory conversations (dev only).
      RAG_DATABASE_URL: postgresql://nexusflow:${POSTGRES_PASSWORD:-nexusflow}@postgres:5432/nexusflow
      # Independent intent agent (supervisor step); falls back to knowledge QA.
      RAG_INTENT_URL: http://intent-agent:8002
      # Independent summary agent for context compaction; empty -> no compaction.
      RAG_SUMMARY_URL: http://summary-agent:8003
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-4o-mini}
      RAG_DEFAULT_TOP_K: "5"
    depends_on:
      postgres:
        condition: service_healthy
      intent-agent:
        condition: service_started
      summary-agent:
        condition: service_started
    ports: ["8001:8001"]

  web:
    build:
      context: ../web
    depends_on: [gateway, workflow-engine]
    ports: ["8088:80"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  redis-data:
  qdrant-data:
  minio-data:
  postgres-data:
  objects:
